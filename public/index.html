<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff5f2"><title>Medici English — 2 минуты</title><link rel="manifest" href="manifest.json"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--ink:#35243b;--muted:#806c7e;--pink:#e92f78;--orange:#ff7b32;--paper:#fff9f6;--line:#f0dce5}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Montserrat,Arial,sans-serif;color:var(--ink);font-size:16px}button{font:inherit;cursor:pointer;border:0;color:inherit}button:focus-visible{outline:3px solid #a73570;outline-offset:3px}.shell{max-width:760px;margin:auto;padding:24px 20px 110px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.logo{display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;background:#35243b;color:#fff;width:43px;height:43px;border-radius:13px;font-size:26px;font-weight:800;letter-spacing:-5px;padding-right:5px}.brand{font-weight:900;line-height:1.05;letter-spacing:2px;font-size:16px}.brand small{display:block;font-size:10px;letter-spacing:3px;font-weight:700;margin-top:4px}.pill{background:#ffe5d5;color:#9c4118;border-radius:30px;padding:10px 14px;font-weight:800;font-size:14px}h1{font-size:clamp(28px,6vw,42px);line-height:1.1;margin:10px 0;font-weight:900;letter-spacing:-1.5px}h2{font-size:22px;margin:0 0 16px;font-weight:850;letter-spacing:-.5px}p{line-height:1.55;margin:8px 0;color:var(--muted)}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:2px;font-weight:800;color:var(--pink)}.hero{position:relative;overflow:hidden;margin:24px 0;background:linear-gradient(135deg,#ed438c,#fa8352);border-radius:26px;color:white;padding:28px;box-shadow:0 10px 30px #e9487c20}.hero p{color:white}.hero .eyebrow{color:#fff4d9}.hero h2{font-size:32px;margin:10px 0}.orb{position:absolute;right:-28px;top:-30px;width:170px;height:170px;border:28px solid #ffffff27;border-radius:50%;pointer-events:none}.hero button{position:relative;background:#fff;color:#bd245d;padding:15px 20px;border-radius:15px;font-weight:800;width:100%;margin-top:18px}.row{display:flex;gap:12px}.stat{flex:1;background:white;border:1px solid var(--line);border-radius:20px;padding:17px 12px}.stat strong{display:block;font-size:25px;font-weight:900}.stat span{font-size:12px;color:var(--muted);font-weight:700}.section{margin-top:27px}.week{display:flex;justify-content:space-between;background:white;border:1px solid var(--line);border-radius:20px;padding:17px 10px;gap:5px}.day{text-align:center;font-size:12px;font-weight:700;color:var(--muted);flex:1}.dot{display:grid;place-items:center;margin:9px auto 0;width:34px;height:34px;border-radius:50%;background:#f7e9ee;color:#b391a3;font-size:15px}.dot.done{background:#fbd2e3;color:#b31a5a}.dot.today{border:2px solid var(--orange);color:var(--ink)}.tip{margin-top:20px;padding:16px 20px;background:#fff0e4;border-radius:18px;color:#714226;font-size:15px;line-height:1.6}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 12px max(10px,env(safe-area-inset-bottom));z-index:5}.nav button{background:transparent;width:min(195px,33%);padding:9px;color:var(--muted);font-size:12px;font-weight:700;border-radius:12px}.nav button.active{color:var(--pink);background:#fff0f6}.nav b{display:block;font-size:21px;margin-bottom:4px}.card{background:#fff;border:1px solid var(--line);border-radius:25px;padding:25px;margin-top:20px}.lessonTop{display:flex;align-items:center;gap:14px}.back{background:#fce5ed;border-radius:12px;width:43px;height:43px;font-size:22px}.track{background:#f8e2ea;height:10px;border-radius:99px;flex:1;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--orange));border-radius:99px;transition:.3s}.timer{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}.word{text-align:center;padding:28px 10px 8px}.word .en{font-size:clamp(34px,8vw,52px);font-weight:900;letter-spacing:-1px;overflow-wrap:anywhere}.pron{color:var(--pink);font-weight:650;margin-top:10px}.translation{font-size:23px;font-weight:700;margin-top:15px}.sound{display:inline-flex;align-items:center;gap:8px;background:#ffeddc;color:#934015;padding:14px 20px;border-radius:50px;margin:20px 0;font-weight:800}.primary{background:linear-gradient(110deg,#d92671,#ef642b);color:white;border-radius:15px;width:100%;font-weight:800;padding:17px;margin-top:16px;min-height:54px}.secondary{background:#fff0f6;border:1px solid #f6c9da;color:#a52a60;border-radius:15px;width:100%;font-weight:800;padding:14px;margin-top:10px}.option{display:block;text-align:left;width:100%;background:#fff9f6;border:2px solid #f2dee6;border-radius:15px;padding:16px;margin-top:10px;font-weight:700}.option.correct{background:#e1f7e6;border-color:#5baf75;color:#236337}.option.wrong{background:#fff0e6;border-color:#f2ae84;color:#963a21}.feedback{font-weight:650;color:#775060;margin:15px 0 0;min-height:25px}.listitem{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}.listitem strong{display:block;font-size:20px}.listitem small{color:var(--muted);font-size:14px}.mini{border-radius:12px;background:#ffe8d7;color:#9b4016;padding:12px}.badge{font-size:13px;padding:6px 10px;border-radius:20px;background:#ffe1ed;color:#b32260;font-weight:700}.empty{text-align:center;padding:25px 5px}.center{text-align:center}.celebrate{font-size:65px}.notice{font-size:13px;color:var(--muted)}@media(min-width:650px){.shell{padding-top:38px}.hero{padding:34px}.hero button{width:auto;min-width:260px}.stat{padding:22px}.week{padding:20px 25px}.dot{width:40px;height:40px}}
</style></head><body><main class="shell" id="app"></main><nav class="nav" id="nav"><button data-tab="home"><b>⌂</b>Сегодня</button><button data-tab="words"><b>▤</b>Мои слова</button><button data-tab="progress"><b>◷</b>Прогресс</button></nav><script>
const topics=[['Знакомство',['Hello','Привет','хэлоу'],['Thank you','Спасибо','сэнк ю'],['Please','Пожалуйста','плиз']],['Вежливость',['Yes','Да','йес'],['No','Нет','ноу'],['Sorry','Извините','сори']],['Утро',['Good morning','Доброе утро','гуд морнинг'],['How are you?','Как дела?','хау ар ю'],['I’m fine','У меня всё хорошо','айм файн']],['В кафе',['Water','Вода','уотэр'],['Tea','Чай','ти'],['Coffee','Кофе','кофи']],['Покупки',['How much?','Сколько стоит?','хау мач'],['Money','Деньги','мани'],['Card','Карта','кард']],['В дороге',['Where?','Где?','уэр'],['Taxi','Такси','такси'],['Hotel','Отель','хоу-тэл']],['Общение',['I understand','Я понимаю','ай андэрстэнд'],['I don’t know','Я не знаю','ай доунт ноу'],['Help me','Помогите мне','хэлп ми']],['Семья',['Family','Семья','фэмили'],['Mother','Мама','мазэр'],['Child','Ребёнок','чайлд']],['Время',['Today','Сегодня','тудэй'],['Tomorrow','Завтра','тумороу'],['Now','Сейчас','нау']],['Самое нужное',['I need help','Мне нужна помощь','ай нид хэлп'],['One moment','Одну минуту','уан моумэнт'],['See you','До встречи','си ю']],['Дом',['Home','Дом','хоум'],['Door','Дверь','дор'],['Room','Комната','рум']],['Еда',['Bread','Хлеб','брэд'],['Milk','Молоко','милк'],['Apple','Яблоко','эпэл']],['Работа',['Work','Работа','уорк'],['Meeting','Встреча','митинг'],['Email','Электронная почта','имэйл']],['Просьбы',['Can you help?','Можете помочь?','кэн ю хэлп'],['Speak slowly','Говорите медленнее','спик слоули'],['Again, please','Ещё раз, пожалуйста','эгэн плиз']],['Самочувствие',['I am tired','Я устала','ай эм тайрд'],['I am happy','Я счастлива','ай эм хэпи'],['I am ready','Я готова','ай эм рэди']]];
const bank=topics.flatMap(t=>t.slice(1)).map((a,id)=>({id,en:a[0],ru:a[1],pron:a[2]}));const dateKey=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const today=()=>dateKey();let state;try{state=JSON.parse(localStorage.getItem('mediciEnglishV1'))||{days:[],words:{},minutes:0}}catch{state={days:[],words:{},minutes:0}};const save=()=>localStorage.setItem('mediciEnglishV1',JSON.stringify(state));let tab='home',lesson=null,tick=null;const app=document.getElementById('app'),nav=document.getElementById('nav');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const learned=()=>Object.keys(state.words).length;function streak(){let n=0,d=new Date();if(!state.days.includes(dateKey(d)))d.setDate(d.getDate()-1);while(state.days.includes(dateKey(d))){n++;d.setDate(d.getDate()-1)}return n}function logo(){return '<header><div class="logo"><div class="mark">M</div><div class="brand">EFFECT MEDICI<small>ENGLISH CLUB</small></div></div><span class="pill">✦ A0</span></header>'}function week(){let d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return '<div class="week">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(day=>{let k=dateKey(d),done=state.days.includes(k),s=`<div class="day">${day}<div class="dot ${done?'done':''} ${k===today()?'today':''}">${done?'✓':d.getDate()}</div></div>`;d.setDate(d.getDate()+1);return s}).join('')+'</div>'}function stats(){return `<div class="row"><div class="stat"><strong>${streak()}</strong><span>дней подряд</span></div><div class="stat"><strong>${learned()}</strong><span>слов в словаре</span></div><div class="stat"><strong>${state.days.length}</strong><span>уроков</span></div></div>`}function render(){clearInterval(tick);nav.style.display='flex';nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let n=state.days.length,done=state.days.includes(today()),topic=topics[Math.min(n,topics.length-1)][0];if(tab==='home'){app.innerHTML=logo()+`<div class="eyebrow">Твой личный репетитор</div><h1>Привет, Мадина!</h1><p>Две минуты английского. Каждый день, в своём темпе.</p><div class="hero"><div class="orb"></div><div class="eyebrow">${done?'Урок выполнен':'День '+(n+1)+' · 2 минуты'}</div><h2>${done?'Отличная работа!':esc(n>=topics.length?'Повторение':topic)}</h2><p>${done?'На сегодня достаточно. Можно повторить слова, если хочется.':'3 короткие карточки, произношение и мини-проверка. Без грамматики.'}</p><button onclick="start(${done})">${done?'Повторить слова':'Начать урок'}</button></div>${stats()}<div class="section"><h2>Моя неделя</h2>${week()}</div><div class="tip">✦ Маленький шаг каждый день. Не нужно запоминать всё сразу — сложные слова будут возвращаться на повторение.</div>`}else if(tab==='words'){app.innerHTML=logo()+`<div class="eyebrow">Личный словарь</div><h1>Мои слова</h1><p>Слова и фразы из пройденных уроков. Нажми на звук, чтобы послушать.</p><div class="card">${learned()?bank.filter(w=>state.words[w.id]).map(w=>`<div class="listitem"><div><strong>${esc(w.en)}</strong><small>${esc(w.ru)} · ${esc(w.pron)}</small><br><span class="badge">${state.words[w.id].score>=2?'Знакомое':'Повторить'}</span></div><button class="mini" aria-label="Прослушать ${esc(w.en)}" onclick="speak(${w.id})">▶</button></div>`).join(''):'<div class="empty">Здесь появятся первые слова после урока.</div>'}</div>${learned()?'<button class="primary" onclick="start(true)">Повторить сложные слова</button>':''}`}else{app.innerHTML=logo()+`<div class="eyebrow">Твой путь</div><h1>Мой прогресс</h1><p>Каждый завершённый урок — маленькая победа.</p><div class="section">${stats()}</div><div class="card"><h2>Регулярность</h2>${week()}<p>Всего занятий: ${state.days.length}</p></div><div class="card"><h2>Мой словарь</h2><p>Знакомые слова: ${Object.values(state.words).filter(w=>w.score>=2).length}</p><p>На повторение: ${Object.values(state.words).filter(w=>w.score<2).length}</p><div class="track"><div class="fill" style="width:${learned()/bank.length*100}%"></div></div><p class="notice">${learned()} из ${bank.length} базовых слов и фраз.</p></div>`}}function speak(id){if(!('speechSynthesis'in window)){alert('Озвучка не поддерживается в этом браузере.');return}let u=new SpeechSynthesisUtterance(bank[id].en);u.lang='en-US';u.rate=.75;let voices=speechSynthesis.getVoices(),v=voices.find(v=>v.lang==='en-US');if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function start(review=false){let seen=bank.filter(w=>state.words[w.id]).sort((a,b)=>state.words[a.id].score-state.words[b.id].score||state.words[a.id].last-state.words[b.id].last),fresh=bank.filter(w=>!state.words[w.id]);let words=review&&seen.length?seen.slice(0,3):[...seen.slice(0,seen.length?1:0),...fresh].slice(0,3);if(words.length<3)words=[...words,...seen.filter(w=>!words.includes(w))].slice(0,3);lesson={words,steps:[...words.map(w=>({w,kind:'learn'})),...shuffle(words).map(w=>({w,kind:'quiz',options:shuffle([w,...shuffle(bank.filter(x=>x.id!==w.id)).slice(0,2)])}))],i:0,started:Date.now(),review,answer:null,correct:0};nav.style.display='none';lessonView();tick=setInterval(updateTime,500)}function updateTime(){if(!lesson)return;let elapsed=Math.floor((Date.now()-lesson.started)/1000),remain=Math.max(0,120-elapsed),el=document.getElementById('timer');if(el)el.textContent=`${Math.floor(remain/60)}:${String(remain%60).padStart(2,'0')}`;if(!remain)finish(true)}function lessonView(){let {w,kind,options}=lesson.steps[lesson.i];let pos=lesson.i+1;app.innerHTML=`<div class="lessonTop"><button class="back" aria-label="На главную" onclick="exitLesson()">×</button><div class="track"><div class="fill" style="width:${(pos-1)/lesson.steps.length*100}%"></div></div><span class="timer" id="timer">2:00</span></div><div class="section"><div class="eyebrow">${pos} из ${lesson.steps.length} · ${kind==='learn'?'Слушай и повторяй':'Вспомни перевод'}</div><h1>${kind==='learn'?'Новое знакомство':'Мини-проверка'}</h1></div><div class="card"><div class="word"><div class="en">${esc(w.en)}</div>${kind==='learn'?`<div class="pron">${esc(w.pron)}</div><div class="translation">${esc(w.ru)}</div>`:''}<button class="sound" onclick="speak(${w.id})">▶ Послушать</button></div>${kind==='learn'?'<p class="center">Послушай и произнеси вслух один раз.</p><button class="primary" onclick="next()">Дальше</button>':`<p class="center">Что означает эта фраза?</p>${options.map(x=>`<button class="option" data-id="${x.id}" onclick="answer(${x.id})">${esc(x.ru)}</button>`).join('')}<div class="feedback" id="feedback" aria-live="polite"></div><button class="primary" id="continue" style="display:none" onclick="next()">Дальше</button>`}</div>`;updateTime()}function record(w,delta){let old=state.words[w.id]||{score:0,last:0};state.words[w.id]={score:Math.max(0,Math.min(5,old.score+delta)),last:Date.now()};save()}function answer(id){if(lesson.answer!==null)return;lesson.answer=id;let w=lesson.steps[lesson.i].w,ok=id===w.id;if(ok)lesson.correct++;record(w,ok?1:-1);document.querySelectorAll('.option').forEach(b=>{b.disabled=true;let bid=Number(b.dataset.id);if(bid===w.id)b.classList.add('correct');else if(bid===id)b.classList.add('wrong')});document.getElementById('feedback').textContent=ok?'Отлично, верно!':'Правильный ответ: '+w.ru+'. Повторим ещё.';document.getElementById('continue').style.display='block'}function next(){let s=lesson.steps[lesson.i];if(s.kind==='learn')record(s.w,0);lesson.i++;lesson.answer=null;if(lesson.i>=lesson.steps.length)finish(false);else lessonView()}function exitLesson(){clearInterval(tick);if('speechSynthesis'in window)speechSynthesis.cancel();lesson=null;tab='home';render()}function finish(timed){clearInterval(tick);let complete=lesson.i>=lesson.steps.length,review=lesson.review,correct=lesson.correct;if(!review&&(complete||lesson.i>0)&&!state.days.includes(today()))state.days.push(today());save();lesson=null;app.innerHTML=`${logo()}<div class="card center"><div class="celebrate">✦</div><div class="eyebrow">${timed?'Две минуты прошли':'Урок завершён'}</div><h1>Молодец, Мадина!</h1><p>Сегодня ты сделала ещё один шаг. ${correct>0?'Верных ответов: '+correct+'.':''} Сложные слова останутся на повторение.</p><button class="primary" onclick="exitLesson()">На главную</button></div>`;nav.style.display='none'}nav.addEventListener('click',e=>{let b=e.target.closest('button');if(b){tab=b.dataset.tab;render()}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
